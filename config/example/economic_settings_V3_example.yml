# ECOMo Example: TU Delft V3.25 soft kite, GG, AWESPA-connected
#
# First LCoE insight for the V3.25 system. The performance comes from the
# AWESPA power model outputs (aep_results.yml + power_curves.yml), so the
# `performance` file below is ignored. All paths resolve relative to this file.

topology:
  power: GG        # GG (ground-gen) or FG (fly-gen)
  wing: soft       # fixed or soft

input_files:
  system: tudelft_V3_25.yml                   # awesIO system_schema.yml (V3.25 kite)
  cost_inputs: economic_cost_inputs_V3.yml
  performance: null                           # ignored in AWESPA-connected mode
  aep_results: ../../data/aep_results.yml     # AWESPA calculate_aep() output
  power_curves: ../../data/power_curves.yml   # awesIO power_curves_schema.yml

wind_resource:
  # awesIO wind_resource_schema.yml file (relative to this settings file).
  # When set, the site wind-speed distribution from this file is used for the
  # economic integrals; otherwise the Weibull parameters below are used.
  resource_file: ../../data/power_law_case_1.yml
  weibull_shape: 2
  weibull_scale: 8     # m/s

business:
  n_years: 25
  cost_of_debt: 0.08
  cost_of_equity: 0.12
  tax_rate: 0.25
  debt_to_equity: 2.3333333333333335   # 70/30 debt-to-equity ratio

# Development stage: early, mid, mature or none.
#   early/mid/mature -- apply a maturity preset: canopy life, operating hours,
#     per-flight-hour maintenance and tether operational life step with the
#     stage, and the tether is put into operational-wear mode (bending
#     master curve off) so the staged operational life governs. This is the
#     maturity-roadmap scenario (e.g. mid -> ~2992 EUR/MWh for V3).
#   none -- no preset; every lifetime, labour hour and tether mode is taken
#     from this file and the cost inputs as written (bending master curve
#     stays on if present). You must then set operations.operating_hours_per_day
#     and operations.maintenance_hours_per_flight_hour explicitly below.
# Any numeric value set explicitly below or in the cost inputs overrides the
# preset (the tether mode, however, is forced by the stage).
development_stage: mid

# Explicit labour OPEX. The operating labour is a per-operating-day cost and
# the maintenance labour is charged per flight hour; both come from the
# development stage unless set here. Omit this block to skip the labour OPEX.
operations:
  labour_price: 50                        # EUR/h
  availability: 0.90                      # fraction of operating-wind time flown
  automation: 0.0                         # automation fraction in [0, 1]

# Replacement frequencies [1/year].
# null = auto-estimate from the load/cycle models, 0 = never replaced.
replacements:
  kite_structure: null
  tether: null
  ultracapacitor: null
  battery: null
  hydraulic_accumulator: 0.1
  hydraulic_motor: 0.083
  pump_motor: 0.125

# Inputs that have no field in the awesIO system schema yet.
# TODO: propose awesIO schema extensions for these.
system_extras:
  onboard_generator_rated_power: 1000.0    # W
  onboard_battery_capacity: 0.0            # kWh
  hydraulic_accumulator_capacity: 1.1377   # kWh
  tether_force_override: null

# Optional analysis/plotting layer (OFF by default). When enabled, the run
# script calls run_analysis() after compute_economics() and writes figures to
# results_example/analysis/. It only re-runs the model (sweeps); it never
# changes the economics. See ecomo.analysis.
analysis:
  enabled: true
  # plots: [stacked_bar, tornado, sweeps, contour, tether_life, power_curve]
  # n_points: 7        # points per 1D sweep
  # grid: [6, 6]       # 2D contour resolution (n_x, n_y)
