metadata:
  name: TU Delft V3.25 Cost Inputs
  description: Economic cost model parameters for the TU Delft V3.25 soft-kite GG system
  note: Soft-wing cost model. Prices in EUR; power-specific prices in EUR/kW, energy-specific
    in EUR/kWh, mass-specific in EUR/kg, area-specific in EUR/m2.
  awesIO_version: 0.1.0
  schema: economic_schema.yml
costs:
  kite:
    structure:
      soft:
        # Two-term kite cost model: C_kite = C_mat_ref*(S/S_ref)^b_mat + C_lab*S
        # Anchor: lean AWE-optimised 60 m2 LEI kite (Scenario B). The V3.25 has a
        # 25 m2 flat wing, so the model is extrapolated down from the 60 m2 anchor.
        material_cost_ref: 3220.0        # [EUR] material cost at reference area
        reference_area: 60.0             # [m2]  S_ref
        material_scaling_exponent: 1.14  # [-]   b_mat; range 1.00-1.22
        labour_cost_coefficient: 13.0    # [EUR/m2] C_lab
        canopy_lifetime_flight_hours: 5000.0  # [h] loaded (reel-out) hours
        canopy_load_exponent: 0.0
        # canopy_reference_force: 8200.0  # [N] default: peak traction force
        # Optional per-cycle wear: canopy life fraction consumed per pumping
        # cycle. It multiplies the annual pumping-cycle count (hundreds of
        # thousands per year), so it is a tiny fatigue fraction (~1e-6), not
        # a per-deployment cost. Omit or set to 0 to disable; largely
        # redundant with the reel-out-hours term for V3.
        # per_cycle_penalty: 1.0e-6
    onboard_generator:
      price_power: 120.0
    onboard_battery:
      price_energy: 150.0
    avionics:
      cost: 30000.0  # fallback fixed cost [EUR] (kept for backward compat.)
      # Scaled KCU model: C_avionics = C_fixed + C_var_ref*(S/S_ref)^beta
      cost_fixed: 2400.0      # [EUR] fixed electronics/computing (no sensors)
      cost_var_ref: 5600.0    # [EUR] variable actuators at reference area
      reference_area: 60.0    # [m2]  S_ref for KCU scaling (same as kite cost)
      scaling_exponent: 1.0   # [-]   beta; range 0.5-1.5
      lifetime_years: 5.0     # [yr]
    sensor:
      cost: 9000.0            # [EUR] airborne electronics/sensor suite CAPEX (was 1000)
      lifetime_years: 5.0     # [yr] service life (same as the KCU)
  tether:
    price_mass: 80
    conductive_manufacturing_factor: 2.5
    creep_life_coefficients:
    - -2.4
    - 8.3
    - -11.2
    - 5.2
    coating_mass_fraction: 0.1
    fibre_area_fraction: 0.85
    # Bending fatigue coefficient a1 couples to the winch drum sizing: a
    # tighter bend (smaller drum-to-tether diameter ratio D/d, set below
    # under ground_station.winch.drum_to_tether_diameter_ratio) strains
    # the fibres more per pass and shortens bend-fatigue life. Calibrated
    # table (user-supplied, 2026-07-09); a1 is interpolated log-linearly
    # in D/d at the winch's ratio. D/d = 100 (the V3 default) reproduces
    # the original single-point anchor a1 = 6.5 exactly.
    #   D/d :  10    20    30    100
    #   a1  :  5.4   5.8   6.1   6.5
    # TODO: only 4 calibration points; extrapolating below D/d=10 or
    #       above D/d=100 is untested (a warning is raised if it happens).
    bending_life_a1_table:
      drum_to_tether_ratio: [10, 20, 30, 100]
      a1: [5.4, 5.8, 6.1, 6.5]
    bending_life_a2: 2.6
    n_bends: 2
    master_curve:
      # Meuwissen/Bosman (2024) HMPE bearing-pressure master curve, calibrated
      # to the 6 mm SK75 (Novak) data (Fig. 5). p_N = k_pw * sigma[MPa]/(D/d);
      # N_f = coefficient * max(p_N, pw_limit_mpa)^(-exponent). Preferred over
      # the a1/a2 semi-log model above when set. Cross-checked against the
      # design-doc H-system anchor (NSP=5 -> ~73,500 discard cycles).
      coefficient: 5000000.0
      exponent: 2.0
      bearing_pressure_coeff: 1.0     # k_pw (Eq. 3)
      pw_limit_mpa: 8.0               # low-p_N clamp
      design_safety_factor: 3.0       # retire at CTF/SF (tether must not fail)
    max_stress: 1500000000
    # Empirical operational (non-fatigue) tether life in flight hours,
    # capturing UV, abrasion, particle ingress and handling wear (not
    # stress-driven). OPT-IN via operational_life_enabled:
    #   - disabled (default): the tether life is governed by bending/creep
    #     fatigue alone. At the V3's low stress bending governs (~2 yr at
    #     the D/d=100 default), so a large winch drum is worth its cost.
    #   - enabled: the governing replacement mode is the shortest of
    #     bending, creep and operational. At the V3's low stress the
    #     operational life (250 h) dominates, so the tether life no longer
    #     depends on bending -> the winch drum can be made smaller
    #     (reduce ground_station.winch.drum_to_tether_diameter_ratio) to
    #     save winch CAPEX WITHOUT shortening the tether life.
    # The value below is kept either way so the mode can be toggled
    # without re-entering it.
    # TODO: operational_life_flight_hours = 250 h is a placeholder pending
    #       RIGO/Kitepower field data; update when received.
    operational_life_enabled: false        # standard: fatigue-governed
    operational_life_flight_hours: 250.0   # [h]
  ground_station:
    # Component service lives: the initial unit is annualised through the
    # CRF (part of the ICC); the replacement OPEX (1/life)*CAPEX charges
    # only the re-buys within the project. Life > project = no replacement.
    winch:
      material: steel
      drum_to_tether_diameter_ratio: 30.0
      safety_factor_diameter: 1.1
      safety_factor_length: 1.1
      lifetime_years: 20.0
      materials:
        aluminum:
          price_mass: 10.0
          density: 2700.0
          max_stress: 300000000.0
        steel:
          price_mass: 7.0
          density: 7850.0
          max_stress: 500000000.0
    drivetrain: electric
    gearbox:
      cost_model: power_based
      lifetime_years: 20.0
      power_based:
        price_power: 70.0
      mass_based:
        price_mass: 12.9
        mass_coefficient: 113.0
        mass_exponent: 0.71
    generator:
      cost_model: power_based
      lifetime_years: 20.0
      power_based:
        price_power: 120.0
      mass_based:
        price_mass: 12.4
        mass_slope: 2.3
        mass_offset: 3400.0
    electrical_storage: ultracapacitor
    ultracapacitor:
      price_energy: 30000.0 # ultracapacitor market unit price (power device; was 6000)
      cycle_life: 1000000.0
    battery:
      price_energy: 200.0
      cycle_life: 10000.0
    power_converter:
      price_power: 100.0
      lifetime_years: 20.0
    pump_motor:
      price_power: 100.0
      maintenance_price_power: 75.0
    hydraulic_accumulator:
      price_energy: 30000.0
      maintenance_price_energy: 1200.0
    hydraulic_motor:
      price_power: 200.0
      maintenance_price_power: 80.0
    launch_land:
      price_area: 165.0      # [EUR/m2]
      lifetime_years: 20.0   # service life (240 months); null = no replacement
  balance_of_system:
    site_preparation:
      price_power: 40.0
    foundation:
      price_power: 55.0
    installation:
      price_power: 40.0
    operations_maintenance:
      price_power: 60.0        # [EUR/kW/yr] per-kW O&M overhead (size-dependent)
    decommissioning:
      installation_fraction: 0.5
    # Recurring consumables bundle (AWT, kite bag, weak link, sensors)
    # replaced yearly. Charged as its own BoS.consumables OPEX leaf,
    # scaled by the maturity factor (matures down as reliability improves).
    consumables_eur_per_year: 2000.0
    consumables_maturity: 1.0
  balance_of_plant: {}
market:
  electricity_price:
    intercept: 45.0
    wind_speed_slope: -1.2
  subsidy: 150.0
