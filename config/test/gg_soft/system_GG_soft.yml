metadata:
  name: ECOMo GG soft Example System
  description: Physical system parameters of the ECOMo GG_soft example case
  note: Converted from eco_system_inputs_GG_soft_example.xlsx. flat_wing_area carries the Excel wing area
    verbatim; projected_surface_area is set to the same value for schema compliance.
  awesIO_version: 0.1.0
  schema: system_schema.yml
assembly:
  connectivity_matrix:
  - - K1
    - T1
  - - T2
    - G1
components:
  kites:
  - name: ECOMo GG_soft example kite
    type: soft_kite_kcu
    version: 1.0
    joints:
      kite_joint:
        id: K1
    wing:
      name: ECOMo GG_soft example wing
      type: LEI_soft_kite
      version: 1.0
      structure:
        mass: 400
        projected_surface_area: 15
        flat_wing_area: 15
  tethers:
  - name: tether
    type: non_conductive_tether
    version: 1.0
    joints:
      upper_tether_joint:
        id: T1
      lower_tether_joint:
        id: T2
    structure:
      length: 300.0
      diameter: 0.02
      density: 1000.0
      conductive: false
      material:
        type: dyneema
        breaking_strength: 1500000000.0
  ground_station:
    name: ECOMo GG_soft example ground station
    type: pumping_ground_gen_station
    version: 1.0
    joints:
      drum_joint:
        id: G1
    structure:
      mass: 0.0
    storages:
    - name: ultracapacitor bank
      type: capacitor_bank
      capacity: 1137.7
    - name: battery bank
      type: battery_bank
      capacity: 1137.7
