metadata:
  name: ECOMo GG soft Cost Inputs
  description: Economic cost model parameters for the ECOMo economic model
  note: Converted from eco_cost_inputs_GG_soft.xlsx. Prices in EUR; power-specific prices in EUR/kW, energy-specific
    in EUR/kWh, mass-specific in EUR/kg, area-specific in EUR/m2.
  awesIO_version: 0.1.0
  schema: economic_schema.yml
costs:
  kite:
    structure:
      soft:
        # Two-term kite cost model: C_kite = C_mat_ref*(S/S_ref)^b_mat + C_lab*S
        # Anchor: lean AWE-optimised 60 m2 LEI kite (Scenario B).
        # TODO: C_mat_ref = 3220 EUR is the expert-estimated lean design cost
        #       minus labour. Conservative prototype anchor = 4146 EUR (use if
        #       no design optimisation). Update when production cost data for
        #       AWE-specific kites become available.
        material_cost_ref: 3220.0        # [EUR] material cost at reference area
        reference_area: 60.0             # [m2]  S_ref
        material_scaling_exponent: 1.14  # [-]   b_mat; range 1.00-1.22
        # TODO: labour_cost_coefficient = 13.0 EUR/m2 assumes seam density
        #       10 m/m2 and sewing cost 1.30 EUR/m (= 7 EUR/h labour rate /
        #       5.4 m/h sewing speed). Sewing speed 5.4 m/h is empirically
        #       constant across kite architectures and scales. Verify the seam
        #       density against the V3 build records.
        labour_cost_coefficient: 13.0    # [EUR/m2] C_lab
        # TODO: lifetime_flying_years = 0.02853 corresponds to 250 h (midpoint
        #       of the observed 100-500 h range). Target lifetime is
        #       5000-10000 h but not yet achieved. Update as empirical wear
        #       data from extended test campaigns become available. The current
        #       value means ~13 replacements/year at 3500 h/yr.
        lifetime_flying_years: 0.02853   # [yr] = 250h / 8760h
    onboard_generator:
      price_power: 120.0
    onboard_battery:
      price_energy: 150.0
    avionics:
      cost: 30000.0  # fallback fixed cost [EUR] (kept for backward compat.)
      # Scaled KCU model: C_avionics = C_fixed + C_var_ref*(S/S_ref)^beta
      # TODO: avionics cost_fixed = 2400 EUR is a rough placeholder. Sensor
      #       hardware (Trimble BX982 GNSS ~6000 EUR + Xsens MTi-G ~3000 EUR)
      #       already exceeds this value. Expert quote required before
      #       publication. Fixed cost: affects only the absolute LCoE level,
      #       not the scaling trend.
      # TODO: cost_fixed (2400) and cost_var_ref (5600) are the 30/70 split of
      #       an 8000 EUR reference KCU total (Braun 2015 product tree). Verify
      #       with supplier quotes for servo motors, gearboxes and controllers.
      cost_fixed: 2400.0      # [EUR] fixed electronics/sensors/computing
      cost_var_ref: 5600.0    # [EUR] variable actuators at reference area
      reference_area: 60.0    # [m2]  S_ref for KCU scaling (same as kite cost)
      scaling_exponent: 1.0   # [-]   beta; range 0.5-1.5
  tether:
    price_mass: 80
    conductive_manufacturing_factor: 2.5
    creep_life_coefficients:
    - -2.4
    - 8.3
    - -11.2
    - 5.2
    coating_mass_fraction: 0.1
    fibre_area_fraction: 0.85
    bending_life_a1: 6.5
    bending_life_a2: 2.6
    n_bends: 2
    max_stress: 1500000000
  ground_station:
    winch:
      material: steel
      drum_to_tether_diameter_ratio: 100.0
      safety_factor_diameter: 1.1
      safety_factor_length: 1.1
      materials:
        aluminum:
          price_mass: 10.0
          density: 2700.0
          max_stress: 300000000.0
        steel:
          price_mass: 7.0
          density: 7850.0
          max_stress: 500000000.0
    drivetrain: electric
    gearbox:
      cost_model: power_based
      power_based:
        price_power: 70.0
      mass_based:
        price_mass: 12.9
        mass_coefficient: 113.0
        mass_exponent: 0.71
    generator:
      cost_model: power_based
      power_based:
        price_power: 120.0
      mass_based:
        price_mass: 12.4
        mass_slope: 2.3
        mass_offset: 3400.0
    electrical_storage: ultracapacitor
    ultracapacitor:
      price_energy: 60000.0
      cycle_life: 1000000.0
    battery:
      price_energy: 200.0
      cycle_life: 10000.0
    power_converter:
      price_power: 100.0
    pump_motor:
      price_power: 100.0
      maintenance_price_power: 75.0
    hydraulic_accumulator:
      price_energy: 30000.0
      maintenance_price_energy: 1200.0
    hydraulic_motor:
      price_power: 200.0
      maintenance_price_power: 80.0
    # Launch & land (take-off & landing) system: fixed CAPEX, annualised
    # over the project lifetime via the capital recovery factor (like all
    # other CAPEX). Its service life drives a replacement OPEX when it is
    # shorter than the project (here 20 yr < 25 yr -> one re-buy).
    launch_land:
      cost: 10000.0          # [EUR]
      lifetime_years: 20.0   # service life (240 months); null = no replacement
  balance_of_system:
    site_preparation:
      price_power: 40.0
    foundation:
      price_power: 55.0
    installation:
      price_power: 40.0
    operations_maintenance:
      price_power: 60.0
    decommissioning:
      installation_fraction: 0.5
  balance_of_plant: {}
market:
  electricity_price:
    intercept: 45.0
    wind_speed_slope: -1.2
  subsidy: 150.0
