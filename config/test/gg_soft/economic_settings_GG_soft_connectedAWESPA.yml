# ECOMo GG Soft-Wing Economic Settings
# Economic model settings for ground-gen soft-wing AWE system

topology:
  power: GG        # GG (ground-gen) or FG (fly-gen)
  wing: soft       # fixed or soft

# All paths are resolved relative to this file's directory.
input_files:
  system: system_GG_soft.yml                           # awesIO system_schema.yml
  cost_inputs: economic_cost_inputs_GG_soft.yml
  performance: system_performance_GG_soft.yml          # ignored in AWESPA-connected mode
  aep_results: ../../../data/aep_results.yml           # AWESPA calculate_aep() output
  power_curves: ../../../data/power_curves.yml         # awesIO power_curves_schema.yml

wind_resource:
  # awesIO wind_resource_schema.yml file (relative to this settings file).
  # When set, the site wind-speed distribution from this file is used for
  # the economic integrals; otherwise the Weibull parameters below are used.
  resource_file: ../../../data/power_law_case_1.yml  # awesIO wind_resource_schema.yml
  weibull_shape: 2
  weibull_scale: 8     # m/s

business:
  n_years: 25
  cost_of_debt: 0.08
  cost_of_equity: 0.12
  tax_rate: 0.25
  debt_to_equity: 2.3333333333333335   # 70/30 debt-to-equity ratio

# Explicit operator and maintenance labour OPEX (the dominant operating
# cost for small, manually-supervised AWE; the per-kW BoS O&M term only
# covers non-labour overhead such as land lease and insurance, so there
# is no double-counting). Omit this block to skip the labour OPEX.
operations:
  operator_hours_per_week: 10            # h/week (fixed, size-independent)
  maintenance_hours_per_flight_hour: 0.05 # h per flight hour
  labour_price: 50                       # EUR/h
  # WARNING: availability currently scales flight hours (maintenance
  # labour) only, NOT the AEP. Lowering it cuts maintenance cost while
  # keeping full energy in the LCoE denominator, which flatters LCoE
  # (backwards). TODO: couple downtime to AEP before sweeping this.
  availability: 1.0                      # fraction of operating-wind time flown

# Replacement frequencies [1/year].
# null = auto-estimate from the load/cycle models, 0 = never replaced.
replacements:
  kite_structure: null
  tether: null
  ultracapacitor: null
  battery: null
  hydraulic_accumulator: 0.1
  hydraulic_motor: 0.083
  pump_motor: 0.125

# Inputs that have no field in the awesIO system schema yet.
# TODO: propose awesIO schema extensions for these.
system_extras:
  onboard_generator_rated_power: 1000.0    # W
  onboard_battery_capacity: 0.0            # kWh
  hydraulic_accumulator_capacity: 1.1377   # kWh
  # Tether force used in AWESPA-connected mode, where no tether force is
  # available from the power model outputs. Single float (constant
  # assumption) or list (one value per wind speed), in N. null omits
  # tether force-based costs (use with caution).
  tether_force_override: null